[theme]
base = "light"
primaryColor = "#2E6E68"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F2F0EA"
textColor = "#1F2933"
borderColor = "#E2DED4"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "6px"
codeBackgroundColor = "#F2F0EA"
codeTextColor = "#173B5C"
greenColor = "#2E6E68"
redColor = "#A4503A"
dataframeHeaderBackgroundColor = "#F2F0EA"

[theme.sidebar]
backgroundColor = "#F2F0EA"
secondaryBackgroundColor = "#FBFAF7"

[client]
toolbarMode = "minimal"
